name: release

# TIER 2 of the two-tier release (ADR-0004). This workflow NEVER COMPILES.
#
# It downloads the natives staged by natives.yml, packages them per ecosystem, and
# publishes. That is what keeps a release to minutes, and it is why a broken release
# is fixed by re-running rather than by rebuilding the world.
#
# Publishing targets are Go, Python and JavaScript. C# has a working binding but no
# NuGet leg -- deliberate, not an omission (ADR-0007).
#
# Each leg publishes ONLY if its repo variable is true: ENABLE_GO, ENABLE_PYPI,
# ENABLE_NPM. A leg that is off is skipped silently, so CHECK THE JOB LIST before
# concluding a release worked -- a green run with three skips is not a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true

permissions:
  contents: write
  id-token: write        # OIDC trusted publishing for PyPI and npm

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      llama_tag: ${{ steps.v.outputs.llama_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # bash, not sh -- see natives.yml: dash has no pipefail and build.sh uses it.
          llama_tag="$(bash core/build.sh --print-tag)"
          [ -n "$llama_tag" ] || { echo "::error::could not read the llama.cpp pin"; exit 1; }
          echo "llama_tag=$llama_tag" >> "$GITHUB_OUTPUT"

      - name: Every manifest must agree with the tag
        run: |
          # This is the guard against a partial bump -- the failure mode the whole
          # release runbook exists to prevent. One version, every package, or no release.
          version="${{ steps.v.outputs.version }}"
          fail=0
          js=$(node -p "require('./bindings/js/package.json').version")
          [ "$js" = "$version" ] || { echo "js package.json is $js, expected $version"; fail=1; }
          py=$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)
          [ "$py" = "$version" ] || { echo "pyproject.toml is $py, expected $version"; fail=1; }
          exit $fail

      - name: The natives for this llama.cpp tag must already be staged
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="natives-${{ steps.v.outputs.llama_tag }}"
          # If this is missing, natives.yml has not run for the current pin. Fail here
          # rather than publish packages with no library inside them.
          gh release view "$tag" >/dev/null 2>&1 || {
            echo "::error::$tag is not staged. Run the natives workflow first."; exit 1; }
          gh release view "$tag" --json assets -q '.assets[].name'

  natives:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the staged natives (no compilation)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p zips && cd zips
          gh release download "natives-${{ needs.preflight.outputs.llama_tag }}" --pattern '*.zip'
          ls -1
          # Unzipped ONLY to verify. The artifact that travels between jobs is the
          # zips, because actions/upload-artifact dereferences symlinks -- which
          # would turn each 14 MB closure into ~40 MB of duplicated libraries inside
          # every wheel, silently. A zip carries the links by construction.
          mkdir -p ../staged && for z in *.zip; do unzip -qo "$z" -d ../staged; done

      - name: Every supported platform must be staged
        run: |
          # This used to be a per-leg `skipping $plat (not staged)`, which is how an
          # empty package ships: the job stays green, the wheel installs, and the
          # failure lands on a user at import time. ADR-0010 makes the supported set
          # a built set -- so a missing platform is a release failure, here, once.
          cd staged
          missing=()
          for plat in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64; do
            if [ -f "$plat/links.json" ]; then
              echo "  ok      $plat"
            else
              missing+=("$plat"); echo "  MISSING $plat"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::not staged: ${missing[*]} — run the natives workflow for the current pin"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: natives, path: zips }

  publish-go:
    needs: [preflight, natives]
    if: vars.ENABLE_GO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag the Go binding
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # Go publishes by tag; there is nothing to upload. The base binding carries
          # no natives -- it resolves them at runtime, or from the natives module a
          # consumer opted into (ADR-0010).
          tag="bindings/go/v${{ needs.preflight.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            echo "$tag already exists; nothing to do (idempotent)"
          else
            git tag "$tag" && git push origin "$tag"
          fi

  publish-go-natives:
    # After the binding: the natives module REQUIRES it at this exact version, and a
    # tag Go cannot resolve is worse than no tag.
    needs: [preflight, natives, publish-go]
    if: vars.ENABLE_GO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: natives, path: zips }
      - name: Unzip the closures (zip preserves the symlinks the bundle needs)
        run: mkdir -p staged && for z in zips/*.zip; do unzip -qo "$z" -d staged; done

      - name: Publish the natives module ON A TAG ONLY, never on a branch
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -e
          version="${{ needs.preflight.outputs.version }}"
          tag="natives/v$version"
          if git ls-remote --tags origin | grep -q "refs/tags/$tag$"; then
            echo "$tag already exists; nothing to do (idempotent)"; exit 0
          fi

          ./natives/stage.sh staged --require-all

          # The published module must resolve the real binding from the proxy. The
          # replace directive exists so the two modules can be developed together;
          # shipping it would make the module uninstallable for everyone else.
          sed -i '/^replace /d; /^\/\/ Local development:/d' natives/go.mod
          sed -i "s|^require github.com/muthuishere/modelnexus/bindings/go .*|require github.com/muthuishere/modelnexus/bindings/go v$version|" natives/go.mod
          # `grep -q ... && { exit 1; }` would be a set -e landmine: grep exits 1 when
          # it finds nothing, which is the SUCCESS case here, and the script would die.
          if grep -q "^replace" natives/go.mod; then
            echo "::error::a replace directive survived into the published module"; exit 1
          fi
          cat natives/go.mod

          # Detached HEAD, tag, push the TAG. The commit is never pushed to a branch,
          # so main's history and every ordinary checkout stay free of ~70 MB per
          # llama.cpp bump. The blobs are still reachable from the tag -- that is
          # unavoidable in one repo (ADR-0010) -- but deleting an old natives tag
          # makes them collectable, which is not true of a commit on main.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f natives/payload natives/go.mod
          git commit -q -m "natives: closure payload for $version (llama.cpp ${{ needs.preflight.outputs.llama_tag }})"
          git tag "$tag"
          git push origin "$tag"
          echo "published $tag ($(du -sh natives/payload | cut -f1))"

  publish-pypi:
    needs: [preflight, natives]
    if: vars.ENABLE_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: natives, path: zips }
      - name: Unzip the closures (zip preserves the symlinks the wheel needs)
        run: mkdir -p staged && for z in zips/*.zip; do unzip -qo "$z" -d staged; done
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Build one wheel per platform
        run: |
          python -m pip install --quiet build wheel
          cd bindings/python
          for plat in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64; do
            src="../../staged/$plat"
            # Guaranteed by the staging check in the natives job; asserted again
            # here so a future edit cannot reintroduce a silent skip.
            [ -d "$src" ] || { echo "::error::$plat missing from staged/"; exit 1; }
            rm -rf modelnexus/native && mkdir -p modelnexus/native
            cp -a "$src" modelnexus/native/
            # A wheel is exactly the right vehicle for a native library; that is what
            # platform tags are for.
            case "$plat" in
              linux-x86_64)   tag=manylinux_2_28_x86_64 ;;
              darwin-aarch64) tag=macosx_11_0_arm64 ;;
              darwin-x86_64)  tag=macosx_10_15_x86_64 ;;
              windows-x86_64) tag=win_amd64 ;;
              windows-aarch64) tag=win_arm64 ;;
            esac
            python -m build --wheel --outdir dist_all
            for w in dist_all/*-any.whl; do
              [ -e "$w" ] || continue
              mv "$w" "$(echo "$w" | sed "s/-any.whl/-$tag.whl/")"
            done
          done
          ls -1 dist_all

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist_all
          skip-existing: true
          # Empty when the secret is unset, which is how the action selects OIDC
          # trusted publishing. Set PYPI_API_TOKEN to use a token instead -- useful
          # for a first publish, since a pending trusted publisher has to be created
          # by hand before the project exists.
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: [preflight, natives]
    if: vars.ENABLE_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: natives, path: zips }
      - name: Unzip the closures (zip preserves the symlinks the wheel needs)
        run: mkdir -p staged && for z in zips/*.zip; do unzip -qo "$z" -d staged; done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish one package per platform, then the launcher
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ needs.preflight.outputs.version }}
          # Wired so that setting the secret is sufficient. Leave it unset to use npm
          # trusted publishing (OIDC) instead; empty is simply ignored by npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e

          # npm publish <name> treats a bare argument as a PACKAGE SPEC to fetch, not
          # a directory -- "npm publish pkg-linux-x86_64" produced
          # "E404 GET /pkg-linux-x86_64 ... is not in this registry". Always ./-prefix
          # the path.
          #
          # And never `|| echo skipping`: that swallows auth failures and makes the job
          # report success while publishing nothing. This run did exactly that -- green
          # job, four packages still 404. Only a genuine "already published" is
          # tolerated; anything else fails the job.
          publish_dir() {
            local dir="$1" out rc
            out="$(npm publish "$dir" --access public 2>&1)" && { echo "$out"; return 0; }
            rc=$?
            echo "$out"
            if grep -qiE "cannot publish over|EPUBLISHCONFLICT|previously published|409" <<<"$out"; then
              echo "  -> already published at this version; continuing"
              return 0
            fi
            echo "::error::npm publish failed for $dir"
            return $rc
          }

          # optionalDependencies: npm installs only the platform that matches and
          # skips the rest without erroring. Proven pattern -- mochallama's CLI ships
          # this way today.
          for plat in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64; do
            src="staged/$plat"
            # Guaranteed by the staging check in the natives job; asserted again
            # here so a future edit cannot reintroduce a silent skip.
            [ -d "$src" ] || { echo "::error::$plat missing from staged/"; exit 1; }
            case "$plat" in
              linux-x86_64)   os=linux;  cpu=x64 ;;
              darwin-aarch64) os=darwin; cpu=arm64 ;;
              darwin-x86_64)  os=darwin; cpu=x64 ;;
              windows-x86_64) os=win32;  cpu=x64 ;;
              windows-aarch64) os=win32; cpu=arm64 ;;
            esac
            pkg="pkg-$plat"; mkdir -p "$pkg/native/$plat"
            # -L, NOT -a: npm pack silently DROPS symlinks. llama.cpp ships its
            # versioned aliases as symlinks, and the bridge links the versioned names
            # (@rpath/libllama.0.dylib), so a symlink-preserving copy produces a
            # package that installs cleanly and fails at first use. Verified: 29 files
            # became 11 and both linked libraries went missing. Dereferencing costs
            # size, but only one platform package installs per machine.
            cp -RL "$src"/. "$pkg/native/$plat/"
            cat > "$pkg/package.json" <<JSON
          {
            "name": "@muthuishere/modelnexus-$plat",
            "version": "$VERSION",
            "description": "modelnexus native library for $plat",
            "os": ["$os"],
            "cpu": ["$cpu"],
            "files": ["native"],
            "license": "MIT"
          }
          JSON
            publish_dir "./$pkg"
          done
          # The launcher's optionalDependencies pin the platform packages BY VERSION,
          # and those are generated above from $VERSION. Hand-maintained pins drift the
          # moment someone bumps package.json and forgets these four lines -- and the
          # failure is a launcher that resolves a version of the native package that was
          # never published, which npm treats as an OPTIONAL dependency and skips in
          # silence. Rewrite them from the one source of truth instead.
          node -e '
            const fs = require("fs");
            const p = "./bindings/js/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const v = process.env.VERSION;
            for (const k of Object.keys(j.optionalDependencies || {})) {
              j.optionalDependencies[k] = v;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("pinned optionalDependencies to " + v);
          '
          publish_dir ./bindings/js
