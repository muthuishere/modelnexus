name: ci

# Build the native core and run every binding's suite on every push.
#
# The model-backed tests SKIP without a GGUF, and CI has none — so this proves the
# bindings compile, load the library, and pass everything that does not need weights.
# A suite that skips must not look like one that passes, so the model-free assertions
# are the ones that matter here and they are real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No macos-13: Intel runners queue indefinitely and would hold every push.
          - { os: ubuntu-latest,  platform: linux-x86_64 }
          - { os: macos-latest,   platform: darwin-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the native bridge
        run: ./core/build.sh

      - name: Verify the ABI is complete
        shell: bash
        run: |
          cd core/dist/${{ matrix.platform }}
          lib=$(ls libllamabridge.* | head -1)
          # Every entry point the bindings register must be exported, or a binding
          # fails at load with an unhelpful symbol error instead of here.
          expected="llb_chat_create llb_chat_destroy llb_chat_infer llb_chat_infer_stream"
          expected="$expected llb_chat_lora llb_embed llb_embed_create llb_embed_destroy"
          expected="$expected llb_model_info llb_rerank llb_set_log_callback"
          expected="$expected llb_set_log_level llb_string_free llb_version"
          if command -v nm >/dev/null; then
            found=$(nm -g "$lib" 2>/dev/null | grep -o 'llb_[a-z_]*' | sort -u | tr '\n' ' ')
            for sym in $expected; do
              case " $found " in *" $sym "*) ;; *) echo "MISSING SYMBOL: $sym"; exit 1;; esac
            done
            echo "all 14 entry points exported"
          fi

      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Go binding
        working-directory: bindings/go
        env: { CGO_ENABLED: '0' }
        run: |
          go vet ./...
          go test ./...

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python binding
        working-directory: bindings/python
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JS binding
        working-directory: bindings/js
        run: |
          npm install --silent
          npm test

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: C# binding
        working-directory: bindings/csharp
        run: dotnet test Modelnexus.Tests/Modelnexus.Tests.csproj -v q --nologo
