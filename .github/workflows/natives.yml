name: natives

# TIER 1 of the two-tier release (ADR-0004). Rare, slow, and the only thing that
# compiles.
#
# Builds the per-platform native closure and parks it in a DURABLE prerelease keyed by
# the pinned llama.cpp tag. Release runs then download this and never compile — which
# is what makes cutting a version take minutes instead of an hour, and is the only way
# darwin-x86_64 gets covered at all when no CI runner exists for it.
#
# Triggered only by changes to the C sources or the build scripts. Re-running is safe:
# assets are overwritten in place.

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/natives.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      llama_tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        # One source of truth for the pin: build.sh --print-tag. Anything else parsing
        # that file with sed is a second source of truth waiting to drift.
        #
        # bash, NOT sh: build.sh opens with `set -euo pipefail`, and dash (Ubuntu's /bin/sh)
        # has no pipefail, so `sh build.sh --print-tag` dies before printing and the tag
        # silently becomes empty. That produced a "natives-" release tag and an HTTP 422.
        # It passed locally because macOS /bin/sh is bash in POSIX mode.
        run: |
          tag="$(bash core/build.sh --print-tag)"
          [ -n "$tag" ] || { echo "::error::could not read the llama.cpp pin"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: darwin-x86_64 is deliberately absent. GitHub's Intel macOS runners
          # queue indefinitely -- observed 50+ minutes with no start, repeatedly -- and
          # one job that never runs blocks the publish step for every platform that
          # did. mochallama hit exactly this and seeds Intel macOS by hand; PUBLISHING.md
          # carries the one-liner. Re-add this entry if the runners become reliable.
          - { os: ubuntu-latest,   platform: linux-x86_64,   script: sh }
          - { os: macos-latest,    platform: darwin-aarch64, script: sh }
          - { os: windows-latest,  platform: windows-x86_64, script: cmd }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (unix)
        if: matrix.script == 'sh'
        run: ./core/build.sh

      - name: Build (windows)
        if: matrix.script == 'cmd'
        shell: cmd
        # Source mode, because llama.cpp publishes no Windows import libraries.
        # Slow by design and confined to this rare workflow.
        run: core\build.cmd --source

      - name: Package
        shell: bash
        run: |
          cd core/dist
          out="../../natives-${{ matrix.platform }}.zip"
          if command -v zip >/dev/null; then
            # -y preserves the symlinks llama.cpp ships on Unix; dereferencing them
            # triples the size of the largest library for nothing.
            zip -ry "$out" "${{ matrix.platform }}"
          else
            # Windows runners have no zip. tar there is bsdtar, which writes zip when
            # -a infers the format from the extension. No symlinks to preserve on
            # Windows anyway -- the build emits plain DLLs.
            tar -a -cf "$out" "${{ matrix.platform }}"
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives-${{ matrix.platform }}.zip

  publish:
    needs: [tag, build]
    # always(): stage whatever DID build rather than losing every platform because one
    # failed or never got a runner. Intel macOS runners in particular sit queued for
    # ages -- mochallama seeds that platform by hand for the same reason. release.yml
    # already skips platforms that are not staged, so partial coverage degrades
    # gracefully instead of blocking a release outright.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Stage the durable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: natives-${{ needs.tag.outputs.llama_tag }}
        run: |
          # Durable and tag-keyed: Go users resolve their runtime library from this
          # release at first use (ADR-0007), so it must not be deleted or retagged.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "native closure for llama.cpp ${{ needs.tag.outputs.llama_tag }}" \
              --notes "Prebuilt modelnexus bridge + llama.cpp runtime, per platform. Consumed by release.yml (which never compiles) and by the Go binding Fetch() at runtime. DO NOT DELETE: this is a runtime dependency for Go users, not merely a build input."
          fi
          gh release upload "$TAG" dist/*.zip --clobber
          echo "staged: $TAG"
          gh release view "$TAG" --json assets -q '.assets[].name'
