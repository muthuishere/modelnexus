name: natives

# TIER 1 of the two-tier release (ADR-0004). Rare, slow, and the only thing that
# compiles.
#
# Builds the per-platform native closure and parks it in a DURABLE prerelease keyed by
# the pinned llama.cpp tag. Release runs then download this and never compile — which
# is what makes cutting a version take minutes instead of an hour, and is the only way
# darwin-x86_64 gets covered at all when no CI runner exists for it.
#
# Triggered only by changes to the C sources or the build scripts. Re-running is safe:
# assets are overwritten in place.

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/natives.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      llama_tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        # One source of truth for the pin: build.sh --print-tag. Anything else parsing
        # that file with sed is a second source of truth waiting to drift.
        #
        # bash, NOT sh: build.sh opens with `set -euo pipefail`, and dash (Ubuntu's /bin/sh)
        # has no pipefail, so `sh build.sh --print-tag` dies before printing and the tag
        # silently becomes empty. That produced a "natives-" release tag and an HTTP 422.
        # It passed locally because macOS /bin/sh is bash in POSIX mode.
        run: |
          tag="$(bash core/build.sh --print-tag)"
          [ -n "$tag" ] || { echo "::error::could not read the llama.cpp pin"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   platform: linux-x86_64,   script: sh }
          - { os: macos-latest,    platform: darwin-aarch64, script: sh }
          # Intel macOS, CROSS-BUILT on the arm64 runner. GitHub's Intel runners queue
          # indefinitely -- 50+ minutes with no start, repeatedly -- and one job that
          # never runs blocks the publish for every platform that did. It used to be
          # seeded by hand, which in practice meant absent.
          #
          # No Intel runner is needed: prebuilt mode never compiles llama.cpp (upstream
          # publishes the x86_64 dylibs), so this is one clang invocation for our
          # ~890-line bridge. Verified under Rosetta below -- ADR-0010, spike 0009.
          - { os: macos-latest,    platform: darwin-x86_64,  script: sh, cross: true }
          - { os: windows-latest,  platform: windows-x86_64, script: cmd }
          # Windows on ARM is not a niche any more -- every Copilot+ PC is one, and
          # so is a Parallels VM on an Apple Silicon Mac. Verified on a real one:
          # without this native, Node (a NATIVE arm64 process) cannot load the x64
          # DLL AT ALL -- "Cannot load 'AMD x64' DLL in 'ARM64 little endian'
          # process" -- and Go, which runs x64-emulated, loads the DLL and then
          # dies inside llama.cpp's compute kernels with 0xC0000409. Neither
          # failure is diagnosable from the message you get.
          - { os: windows-11-arm,  platform: windows-aarch64, script: cmd }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (unix)
        if: matrix.script == 'sh'
        run: ./core/build.sh ${{ matrix.cross && format('--platform {0}', matrix.platform) || '' }}

      - name: The cross-built native must LOAD AND GENERATE, not merely be the right arch
        if: matrix.cross
        run: |
          # `lipo -archs` saying x86_64 is the same weak claim that let three broken
          # Windows natives ship green: the ARM one loaded cleanly and then died
          # inside ggml's compute kernels with 0xC0000409. Only producing a token
          # exercises that path, and Rosetta 2 makes this runner an honest Intel
          # test bed.
          arch="$(lipo -archs core/dist/${{ matrix.platform }}/libllamabridge.dylib)"
          echo "bridge arch: $arch"
          case "${{ matrix.platform }}" in
            *-x86_64)  grep -q x86_64 <<<"$arch" || { echo "::error::not x86_64"; exit 1; } ;;
            *-aarch64) grep -q arm64  <<<"$arch" || { echo "::error::not arm64";  exit 1; } ;;
          esac

          # A 0.5B model: this proves the kernels run, not that the model is good.
          model="$PWD/.model.gguf"
          curl -fsSL -o "$model" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true"

          # Built GOARCH=amd64 and run under Rosetta 2, which is what makes an arm64
          # runner an honest Intel test bed. -arch makes a silently-native binary a
          # failure rather than a false pass.
          (cd bindings/go && GOOS=darwin GOARCH=amd64 go build -o /tmp/loadprobe ./cmd/loadprobe)
          MODELNEXUS_LIB="$PWD/core/dist/${{ matrix.platform }}" \
            arch -x86_64 /tmp/loadprobe -arch amd64 "$model"

      - name: Build (windows)
        if: matrix.script == 'cmd'
        shell: cmd
        # Source mode, because llama.cpp publishes no Windows import libraries.
        # Slow by design and confined to this rare workflow.
        run: core\build.cmd --source

      - name: Package
        shell: bash
        run: |
          cd core/dist
          out="../../natives-${{ matrix.platform }}.zip"
          if command -v zip >/dev/null; then
            # -y preserves the symlinks llama.cpp ships on Unix; dereferencing them
            # triples the size of the largest library for nothing.
            zip -ry "$out" "${{ matrix.platform }}"
          elif command -v 7z >/dev/null; then
            # Windows. NOT `tar -a -cf`: this step runs under Git Bash, whose tar is
            # GNU tar, and GNU tar ignores -a for zip -- it happily writes a TAR file
            # named .zip, which only fails later when the release job tries to unzip
            # it ("End-of-central-directory signature not found"). 7z is present on
            # the Windows runners and writes a real zip.
            7z a -tzip "$out" "${{ matrix.platform }}" >/dev/null
          else
            tar -a -cf "$out" "${{ matrix.platform }}"
          fi
          # Prove it is actually a zip before it becomes a release asset -- a bad
          # archive here is only discovered at publish time otherwise.
          python3 -c "import sys,zipfile; sys.exit(0 if zipfile.is_zipfile('$out') else 1)" \
            || { echo "::error::$out is not a valid zip"; exit 1; }
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives-${{ matrix.platform }}.zip

  publish:
    needs: [tag, build]
    # always(): stage whatever DID build rather than losing every platform because one
    # failed or never got a runner. Intel macOS runners in particular sit queued for
    # ages -- mochallama seeds that platform by hand for the same reason. release.yml
    # already skips platforms that are not staged, so partial coverage degrades
    # gracefully instead of blocking a release outright.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Stage the durable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: natives-${{ needs.tag.outputs.llama_tag }}
        run: |
          # Durable and tag-keyed: Go users resolve their runtime library from this
          # release at first use (ADR-0007), so it must not be deleted or retagged.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "native closure for llama.cpp ${{ needs.tag.outputs.llama_tag }}" \
              --notes "Prebuilt modelnexus bridge + llama.cpp runtime, per platform. Consumed by release.yml (which never compiles) and by the Go binding Fetch() at runtime. DO NOT DELETE: this is a runtime dependency for Go users, not merely a build input."
          fi
          gh release upload "$TAG" dist/*.zip --clobber
          echo "staged: $TAG"
          gh release view "$TAG" --json assets -q '.assets[].name'
